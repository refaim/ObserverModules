[project]
name = "unpackrat-build"
version = "0.1.0"
description = "Direct MSBuild and validator build tooling for unpackrat"
requires-python = "==3.14.7"
dependencies = [
    "coverage==7.15.2",
    "filelock==3.32.2",
    "psutil==7.2.2",
    "pywin32==312; sys_platform == 'win32'",
]

[tool.uv]
package = false

[tool.coverage.run]
branch = true
command_line = "-m unittest discover -s tests -p test_*.py"
source = ["."]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]
fail_under = 100
include = ["core/*", "main.py", "native.py", "source_checks.py", "diagnostics.py",
           "packaging_ops.py"]
show_missing = true
skip_covered = false
