[project]
name = "unpackrat-build"
version = "0.8.0"
description = "Minimal MSBuild build driver and packaging for unpackrat"
requires-python = "==3.14.7"
dependencies = [
    "coverage==7.16.2",
    "filelock==4.1.1",
    "psutil==7.2.2",
    "pywin32==312; sys_platform == 'win32'",
]

[tool.uv]
package = false

[tool.coverage.run]
branch = true
command_line = "-m unittest discover -s tests -p test_*.py"
source = ["."]

[tool.coverage.report]
exclude_lines = []
fail_under = 100
include = ["main.py", "leaks.py", "licenses.py"]
show_missing = true
skip_covered = false
