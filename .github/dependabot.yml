{
  "version": 2,
  "updates": [
    {
      "package-ecosystem": "vcpkg",
      "directory": "/",
      "open-pull-requests-limit": 1,
      "allow": [
        {"dependency-name": "github.com/microsoft/vcpkg"}
      ],
      "ignore": [
        {
          "dependency-name": "github.com/microsoft/vcpkg",
          "versions": ["<=2026.10.15"]
        }
      ],
      "schedule": {
        "interval": "weekly",
        "day": "monday",
        "time": "09:00",
        "timezone": "Asia/Vladivostok"
      }
    }
  ]
}
