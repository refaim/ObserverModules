          $filtered = Join-Path $fixture 'filtered.sarif'
          & $python $filter --input $github --output $filtered --split-lines -- '-**:-warnings-as-errors'
          if ($LASTEXITCODE -ne 0) { throw 'Clang report fixture filter failed.' }
          & $sarif validate $filtered
          if ($LASTEXITCODE -ne 0) { throw 'Clang report fixture SARIF validation failed.' }
          $document = Get-Content -LiteralPath $filtered -Raw | ConvertFrom-Json
          $findings = @($document.runs[0].results)
          $first = @($findings | Where-Object {
            $_.locations[0].physicalLocation.artifactLocation.uri -match 'space%20.*fixture\.cpp$'
          })
          $second = @($findings | Where-Object {
            $_.locations[0].physicalLocation.artifactLocation.uri -match 'other/src/fixture\.cpp$'
          })
          if ($findings.Count -ne 2 -or $first.Count -ne 1 -or $second.Count -ne 1 -or
              @($findings | Where-Object { $_.ruleId -ne 'bugprone-use-after-move' }).Count -ne 0 -or
              $first[0].locations[0].physicalLocation.region.startLine -ne 2 -or
              $first[0].locations[0].physicalLocation.region.startColumn -ne 3 -or
              $second[0].locations[0].physicalLocation.region.startLine -ne 3 -or
              $second[0].locations[0].physicalLocation.region.startColumn -ne 5) {
            throw 'Clang report fixture lost or merged same-basename findings or their relative locations.'
          }

      - name: Restore reusable clang-tidy cache
        if: inputs.stage == 'clang-tidy'
        id: tidy-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The client stores only successful, empty-output calls. Toolchain and image versions
          # scope this tree; a commit key and shared prefix reuse unchanged translation units.
          path: ${{ runner.temp }}/clang-tidy-cache-data/${{ inputs.arch }}/${{ hashFiles('build/main.py', 'build/*.props', 'build/*.targets', 'build/projects/**', 'vcpkg.json', 'vcpkg-configuration.json', 'build/vcpkg/ports/**', 'build/vcpkg/triplets/**') }}
          key: ctcache-v2-857b14271d3ded5511c2e6a60f2dc20c1e4b5680-llvm23.1.3-9ee6a2192fbb30c776415af529927f76ca6b5d1d55699bb1315f9878e610b5b8-v145${{ steps.msvc-toolset.outputs.version }}-sdk10.0.26100.0-${{ steps.runner-image.outputs.identity }}-${{ inputs.arch }}-${{ hashFiles('build/main.py', 'build/*.props', 'build/*.targets', 'build/projects/**', 'vcpkg.json', 'vcpkg-configuration.json', 'build/vcpkg/ports/**', 'build/vcpkg/triplets/**') }}-${{ github.sha }}
          restore-keys: |
            ctcache-v2-857b14271d3ded5511c2e6a60f2dc20c1e4b5680-llvm23.1.3-9ee6a2192fbb30c776415af529927f76ca6b5d1d55699bb1315f9878e610b5b8-v145${{ steps.msvc-toolset.outputs.version }}-sdk10.0.26100.0-${{ steps.runner-image.outputs.identity }}-${{ inputs.arch }}-${{ hashFiles('build/main.py', 'build/*.props', 'build/*.targets', 'build/projects/**', 'vcpkg.json', 'vcpkg-configuration.json', 'build/vcpkg/ports/**', 'build/vcpkg/triplets/**') }}-

      - name: Prepare the official clang-tidy cache bridge
        if: inputs.stage == 'clang-tidy'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'clang-report-tools'
          $cache = Join-Path $root 'venv/Scripts/clang-tidy-cache.exe'
          $tidy = Join-Path $env:RUNNER_TEMP 'unpackrat/tools/llvm/23.1.3/bin/clang-tidy.exe'
          if (-not (Test-Path -LiteralPath $cache -PathType Leaf) -or
              -not (Test-Path -LiteralPath $tidy -PathType Leaf)) {
            throw 'Pinned clang-tidy cache or analyzer is missing.'
          }
          $bridge = Join-Path $env:RUNNER_TEMP 'clang-tidy-cache-bridge.cmd'
          [IO.File]::WriteAllText($bridge, "@echo off`r`n`"$cache`" `"$tidy`" %*`r`nexit /b %ERRORLEVEL%`r`n",
            [Text.ASCIIEncoding]::new())
          $cacheDir = Join-Path $env:RUNNER_TEMP 'clang-tidy-cache-data/${{ inputs.arch }}/${{ hashFiles('build/main.py', 'build/*.props', 'build/*.targets', 'build/projects/**', 'vcpkg.json', 'vcpkg-configuration.json', 'build/vcpkg/ports/**', 'build/vcpkg/triplets/**') }}'
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          $env:CTCACHE_DIR = $cacheDir
          $env:CTCACHE_KEEP_COMMENTS = '1'
