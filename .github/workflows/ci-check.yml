          if ($LASTEXITCODE -ne 0) { throw 'Pinned clang report cache validation failed.' }
          # The fixture lives only under runner.temp; no synthetic result can reach upload paths.
          $fixture = Join-Path $env:RUNNER_TEMP 'clang-report-fixture'
          $source = Join-Path $fixture 'space ü/src/fixture.cpp'
          $other = Join-Path $fixture 'other/src/fixture.cpp'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $source) | Out-Null
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $other) | Out-Null
          "int main() {`n  return 0;`n}`n" | Set-Content -LiteralPath $source -Encoding utf8
          "int second() {`n  return 0;`n}`n" | Set-Content -LiteralPath $other -Encoding utf8
          $log = Join-Path $fixture 'diagnostic.log'
          # Exercise native diagnostic newlines through the production runner entry point.
          @'
          from pathlib import Path
          import subprocess
          import sys

          sys.path.insert(0, 'build')
          from main import _CLANG_TIDY_RUNNER_BOOTSTRAP

          fixture = Path(sys.argv[1])
          source, other = sys.argv[2:]
          context = "  return 0;\r\n  ^\r\n"
          payload = (
              f"{source}:2:3: error: intentional fixture [bugprone-use-after-move,-warnings-as-errors]\r\n"
              + context + f"{source}:2:3: note: first context\r\n" + context
              + f"{other}:3:5: error: second fixture [bugprone-use-after-move,-warnings-as-errors]\r\n"
              + context + f"{other}:3:5: note: second context\r\n" + context
          )
          runner = fixture / 'emit-diagnostic.py'
          runner.write_text("import sys\nsys.stdout.reconfigure(encoding='utf-8')\n"
                            + f"print({payload!r}, end='')\nraise SystemExit(7)\n", encoding='utf-8')
          completed = subprocess.run(
              [sys.executable, '-c', _CLANG_TIDY_RUNNER_BOOTSTRAP, str(runner)],
              capture_output=True, check=False)
          if completed.returncode != 7 or completed.stdout != payload.encode('utf-8'):
              raise ValueError('Runner entry point changed native diagnostic bytes or exit status')
          (fixture / 'diagnostic.log').write_bytes(completed.stdout)
