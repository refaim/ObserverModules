          @'
          from importlib.metadata import version
          from codechecker_report_converter.report.parser.sarif import Parser

          required = {'lxml': '6.1.3', 'PyYAML': '6.0.3', 'sarif-tools': '3.0.5',
                      'jsonpath-ng': '1.10.1', 'ctcache': '1.2.0+g857b142'}
          for package, expected in required.items():
              if version(package) != expected:
                  raise ValueError(f'Wrong {package} version')
          document = Parser().convert([])
          if (document.get('version') != '2.1.0' or len(document.get('runs', [])) != 1 or
