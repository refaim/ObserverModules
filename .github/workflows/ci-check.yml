          'CTCACHE_KEEP_COMMENTS=1' | Add-Content -Path $env:GITHUB_ENV
          "UNPACKRAT_CLANG_TIDY_CACHE=$bridge" | Add-Content -Path $env:GITHUB_ENV

      # Probe the actual pinned cache and analyzer under runner.temp before the project gate.
      - name: Verify pinned clang-tidy cache behavior
        if: inputs.stage == 'clang-tidy'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'clang-report-tools'
          $cache = Join-Path $root 'venv/Scripts/clang-tidy-cache.exe'
          $bridge = Join-Path $env:RUNNER_TEMP 'clang-tidy-cache-bridge.cmd'
          $fixture = Join-Path $env:RUNNER_TEMP 'clang-tidy-cache-fixture'
          New-Item -ItemType Directory -Force -Path $fixture | Out-Null
          $env:CTCACHE_DIR = Join-Path $fixture 'cache'
          $env:CTCACHE_KEEP_COMMENTS = '1'
          $header = Join-Path $fixture 'header.h'
          $config = Join-Path $fixture '.clang-tidy'
          $source = Join-Path $fixture 'clean.cpp'
          $independent = Join-Path $fixture 'independent.cpp'
          $bad = Join-Path $fixture 'bad.cpp'
          $clangCl = Join-Path $env:RUNNER_TEMP 'unpackrat/tools/llvm/23.1.3/bin/clang-cl.exe'
          $compileCommands = Join-Path $fixture 'compile_commands.json'
          $database = @($source, $independent, $bad) | ForEach-Object {
            [pscustomobject]@{
              directory = $fixture
              file = $_
              command = '"{0}" /c /std:c++23 -Qunused-arguments /clang:-frewrite-includes /I"{1}" "{2}"' -f
                $clangCl, $fixture, $_
            }
          }
          $database | ConvertTo-Json | Set-Content -LiteralPath $compileCommands -Encoding utf8
          @('inline int value() { return 1; }',
            '#define BAD2 1+2 // NOLINT(bugprone-macro-parentheses)',
            '#define BAD3(A) (A+1) // NOLINT(bugprone-macro-parentheses)') |
            Set-Content -LiteralPath $header
          "#include `"header.h`"`nint main() { return value(); }" | Set-Content -LiteralPath $source
          'int independent() { return 0; }' | Set-Content -LiteralPath $independent
          'inline unsigned bad_literal() { return sizeof(42); }' | Set-Content -LiteralPath $bad
          "Checks: '-*,bugprone-sizeof-expression,bugprone-macro-parentheses'`nHeaderFilterRegex: '^$'" |
            Set-Content -LiteralPath $config
          & $cache --zero-stats
          if ($LASTEXITCODE -ne 0) { throw 'ctcache fixture statistics reset failed.' }
          function Read-CacheStats {
            $json = & $cache --print-stats | Out-String
            if ($LASTEXITCODE -ne 0) { throw 'ctcache statistics query failed.' }
            return $json | ConvertFrom-Json
          }
          function Invoke-TidyProbe {
            param([string] $File)
            $output = & $bridge '-p' $fixture $File "-config-file=$config" '-warnings-as-errors=*' 2>&1 | Out-String
            return [pscustomobject]@{ Code = $LASTEXITCODE; Output = $output }
          }
          $first = Invoke-TidyProbe $source
          $firstIndependent = Invoke-TidyProbe $independent
          $second = Invoke-TidyProbe $source
          $secondIndependent = Invoke-TidyProbe $independent
          $stats = Read-CacheStats
          if ($first.Code -ne 0 -or $firstIndependent.Code -ne 0 -or
              $second.Code -ne 0 -or $secondIndependent.Code -ne 0 -or
              $stats.local.miss_count -ne 2 -or $stats.local.hit_count -ne 2 -or
              $stats.local.cached_count -ne 2) {
            throw 'ctcache did not cache and reuse both independent translation units.'
          }
          '// changed source comment' | Add-Content -LiteralPath $source
          $changedSource = Invoke-TidyProbe $source
          $unaffectedAfterSource = Invoke-TidyProbe $independent
          $afterSource = Read-CacheStats
          if ($changedSource.Code -ne 0 -or $unaffectedAfterSource.Code -ne 0 -or
              $afterSource.local.miss_count -ne 3 -or $afterSource.local.hit_count -ne 3 -or
              $afterSource.local.cached_count -ne 3) {
            throw 'ctcache invalidated an unrelated translation unit after a source edit.'
          }
          '// changed header comment' | Add-Content -LiteralPath $header
          $changedHeader = Invoke-TidyProbe $source
          $unaffectedAfterHeader = Invoke-TidyProbe $independent
          $afterHeader = Read-CacheStats
          if ($changedHeader.Code -ne 0 -or $unaffectedAfterHeader.Code -ne 0 -or
              $afterHeader.local.miss_count -ne 4 -or $afterHeader.local.hit_count -ne 4 -or
              $afterHeader.local.cached_count -ne 4) {
            throw 'ctcache reused an obsolete header result or invalidated an unrelated unit.'
          }
          "Checks: '-*,bugprone-sizeof-expression,bugprone-macro-parentheses'`nHeaderFilterRegex: '.*'" |
            Set-Content -LiteralPath $config
          $changedConfig = Invoke-TidyProbe $source
          $refreshedIndependent = Invoke-TidyProbe $independent
          $afterConfig = Read-CacheStats
          if ($changedConfig.Code -ne 0 -or $refreshedIndependent.Code -ne 0 -or
              $afterConfig.local.miss_count -ne 6 -or $afterConfig.local.cached_count -ne 6) {
            throw ("ctcache reused an obsolete analyzer configuration. SourceCode={0}; IndependentCode={1}; Stats={2}`nSource output:`n{3}`nIndependent output:`n{4}" -f
              $changedConfig.Code, $refreshedIndependent.Code,
              ($afterConfig | ConvertTo-Json -Depth 5 -Compress),
              $changedConfig.Output, $refreshedIndependent.Output)
          }
          $database[0].command += ' /DCHANGED=1'
          $database | ConvertTo-Json | Set-Content -LiteralPath $compileCommands -Encoding utf8
          $changedFlags = Invoke-TidyProbe $source
          $afterFlags = Read-CacheStats
          if ($changedFlags.Code -ne 0 -or $afterFlags.local.miss_count -ne 7 -or
              $afterFlags.local.cached_count -ne 7) {
            throw 'ctcache reused an obsolete compile-flag result.'
          }
          $badFirst = Invoke-TidyProbe $bad
          $badSecond = Invoke-TidyProbe $bad
          $afterBad = Read-CacheStats
          if ($badFirst.Code -eq 0 -or $badSecond.Code -eq 0 -or
              $badFirst.Output -notmatch 'bugprone-sizeof-expression' -or
              $badSecond.Output -notmatch 'bugprone-sizeof-expression' -or
              $afterBad.local.hit_count -ne 4 -or $afterBad.local.cached_count -ne 7 -or
              $afterBad.local.miss_count -ne 9) {
            throw 'ctcache hid or cached a clang-tidy finding.'
          }
          # Preserve the same cache while changing only an included header's NOLINT comments.
          # Rewritten includes make raw macro definitions part of the official cache key.
          $headerText = [IO.File]::ReadAllText($header)
          [IO.File]::WriteAllText($header,
            $headerText.Replace(' // NOLINT(bugprone-macro-parentheses)', ''),
            [Text.UTF8Encoding]::new($false))
          $unsuppressedFirst = Invoke-TidyProbe $source
          $unsuppressedSecond = Invoke-TidyProbe $source
          $unaffectedAfterNolint = Invoke-TidyProbe $independent
          $afterNolint = Read-CacheStats
          if ($unsuppressedFirst.Code -eq 0 -or $unsuppressedSecond.Code -eq 0 -or
              $unaffectedAfterNolint.Code -ne 0 -or
              $unsuppressedFirst.Output -notmatch 'bugprone-macro-parentheses' -or
              $unsuppressedSecond.Output -notmatch 'bugprone-macro-parentheses' -or
              $afterNolint.local.hit_count -ne 5 -or $afterNolint.local.miss_count -ne 11 -or
              $afterNolint.local.cached_count -ne 7) {
            throw 'ctcache reused a clean NOLINT result or cached a finding.'
          }
          Write-Host 'ctcache fixture: independent units, source/header/config/flags invalidation and uncached findings passed.'

      - name: Save the pinned clang report tools
