          if len(setups) != 1 or not source.is_file() or not globber.is_file():
              raise ValueError('Pinned report converter source is incomplete')
          if len(cache_packages) != 1:
              raise ValueError('Pinned ctcache source is incomplete')
          (root / 'package-path.txt').write_text(str(setups[0].parent), encoding='utf-8')
