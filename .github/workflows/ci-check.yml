name: CI check

# One maintained, reusable job per (stage, architecture) slice.  Every provisioning step is
# gated to the stage that needs it, so a leaks measurement never restores vcpkg or runs MSBuild,
# the source-only tools are never installed for a native build, and the standalone LLVM 23
# analyzer/formatter is never provisioned for the MSVC build or analysis slices.  The caller
# keeps the required check names; this file only owns the shared setup and the uploads.

on:
  workflow_call:
    inputs:
      arch:
        description: The architecture to verify, or "none" for the source stage.
        required: true
        type: string
      stage:
        description: The driver stage to run (source, native-debug, native-release, msvc-analysis, clang-tidy, coverage, asan, ubsan, fuzz, leaks).
        required: true
        type: string

env:
  VCPKG_ROOT: C:\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-binary-cache

jobs:
  check:
    name: ${{ inputs.stage }}-${{ inputs.arch }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 120

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Select the installed VS2026 compiler; CI never modifies Visual Studio components.
      - name: Verify the installed MSVC v145 toolset
        if: contains(fromJSON('["source","native-debug","native-release","msvc-analysis","clang-tidy","coverage","asan","ubsan","fuzz"]'), inputs.stage)
        id: msvc-toolset
        shell: pwsh
        run: |
          $installerRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer'
          $vswhere = Join-Path $installerRoot 'vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw "Missing vswhere: $vswhere" }
          $selected = @(& $vswhere -latest -products '*' -version '[18.0,19.0)' `
            -requires 'Microsoft.Component.MSBuild' `
            -requires 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64' `
            -property 'installationPath' | Where-Object { $_ -and $_.Trim() })
          if ($LASTEXITCODE -ne 0 -or $selected.Count -eq 0) { throw 'No installed VS2026 C++ toolset.' }
          $installation = $selected[0].Trim()
          # Select the same numeric servicing version as the driver.
          $toolsetRoot = Join-Path $installation 'VC/Tools/MSVC'
          $toolsets = @(Get-ChildItem -LiteralPath $toolsetRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^14\.51(?:\.\d+)+$' } |
            Sort-Object -Property @{ Expression = { [version] $_.Name } })
          if ($toolsets.Count -eq 0) { throw "No MSVC 14.51 toolset below $toolsetRoot." }
          $toolset = $toolsets[-1].FullName
          foreach ($architecture in @('x86', 'x64')) {
            $compiler = Join-Path $toolset "bin/Hostx64/$architecture/cl.exe"
            if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw "Missing MSVC compiler: $compiler" }
          }
          "version=$($toolsets[-1].Name)" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: build/uv.lock
          cache-suffix: ${{ inputs.stage }}-${{ inputs.arch }}

      # Only a build or source stage restores the dependency cache, so its key must never be
      # shared with the sanitizer toolchain under the same image+arch.
      - name: Identify the hosted runner image
        if: inputs.stage != 'leaks'
        id: runner-image
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ImageOS) -or
              [string]::IsNullOrWhiteSpace($env:ImageVersion)) {
            throw 'GitHub runner image identity is unavailable.'
          }
          "identity=$($env:ImageOS)-$($env:ImageVersion)" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Cache vcpkg binaries
        if: inputs.stage != 'leaks'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ steps.runner-image.outputs.identity }}-${{ inputs.arch == 'none' && 'x64' || inputs.arch }}-${{ (inputs.stage == 'asan' || inputs.stage == 'fuzz') && 'asan' || 'standard' }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'build/vcpkg/ports/**', 'build/vcpkg/triplets/*.cmake') }}

      - name: Provision the pinned vcpkg tool
        if: inputs.stage != 'leaks'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $baseline = (Get-Content -Raw -LiteralPath 'vcpkg.json' | ConvertFrom-Json).'builtin-baseline'
          if ($baseline -notmatch '^[0-9a-f]{40}$') {
            throw "Invalid vcpkg builtin baseline: $baseline"
          }
          git -C $env:VCPKG_ROOT cat-file -e "$baseline^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git -C $env:VCPKG_ROOT fetch --no-tags --depth=1 origin $baseline
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to fetch vcpkg baseline $baseline."
            }
          }
          git -C $env:VCPKG_ROOT -c advice.detachedHead=false `
            checkout --detach --force $baseline
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to check out vcpkg baseline $baseline."
          }
          # The vcpkg tool is a pinned prebuilt binary from the official release, not something
          # this job rebuilds from the checked-out tree. Fetch it with gh, verify the exact
          # SHA-256, then overwrite the tool binary only. The in-tree bootstrap script must not
          # run, because it would rebuild and replace this verified tool with the tree's own build.
          $toolDir = Join-Path $env:RUNNER_TEMP 'vcpkg-tool-2026-09-26'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          gh release download 2026-09-26 --repo microsoft/vcpkg-tool --pattern 'vcpkg.exe' --dir $toolDir
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to download the pinned vcpkg tool.'
          }
          $tool = Join-Path $toolDir 'vcpkg.exe'
          $expected = '2a4ae1467b9e797964c60c919d057b9e5dc1ec03f4b9632c1150026db25201f2'
          if ((Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash -ne $expected) {
            throw 'Pinned vcpkg tool SHA-256 validation failed.'
          }
          Copy-Item -LiteralPath $tool -Destination (Join-Path $env:VCPKG_ROOT 'vcpkg.exe') -Force

      # Every restoring stage, including ci-source's header restore, uses this shared setup.
      # The tiny standalone asset needs no separate cache or provisioning job.
      - name: Provision the pinned LibMaker tool
        if: contains(fromJSON('["source","native-debug","native-release","msvc-analysis","clang-tidy","coverage","asan","ubsan","fuzz"]'), inputs.stage)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP 'unpackrat/tools/libmaker/1.0.4'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          gh release download v1.0.4 --repo Chuyu-Team/LibMaker --pattern 'LibMaker.exe' --dir $directory --clobber
          if ($LASTEXITCODE -ne 0) { throw "Unable to download the pinned LibMaker tool: $LASTEXITCODE" }
          $tool = Join-Path $directory 'LibMaker.exe'
          if ((Get-Item -LiteralPath $tool).Length -ne 236544) { throw 'Unexpected LibMaker asset size.' }
          # Pin the upstream asset bytes qualified for this build; release metadata has no digest.
          $expected = '0aa2e9d937e9838d7d69c011897bf066a0cb44402eb562705179be74bf1c0fbd'
          if ((Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash -ne $expected) {
            throw 'Pinned LibMaker SHA-256 validation failed.'
          }
          $directory | Add-Content -Path $env:GITHUB_PATH

      - name: Prepare the pinned Python environment
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" | Add-Content -Path $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" | Add-Content -Path $env:GITHUB_ENV
          uv sync --project build --frozen

      # The instrumentation stages need the matched LLVM 21.1.8 toolchain that the separate
      # instrumentation-tools job publishes. They download only this run's artifact and select it
      # through a dedicated variable, never by overriding the standalone clang-tidy/format pin.
      # Only coverage, UBSan and fuzz consume the LLVM toolchain; ASan is the MSVC 14.51 dynamic
      # ASan build and needs no LLVM 21 preflight.
      - name: Collect the instrumentation toolchain
        if: contains(fromJSON('["coverage","ubsan","fuzz"]'), inputs.stage)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: llvm-instrumentation-21.1.8
          path: ${{ runner.temp }}/unpackrat/tools/llvm/21.1.8

      - name: Select the instrumentation toolchain
        if: contains(fromJSON('["coverage","ubsan","fuzz"]'), inputs.stage)
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'unpackrat/tools/llvm/21.1.8'
          $llvmCompilerHome = Join-Path $root 'x64'
          foreach ($tool in @('clang-cl', 'llvm-cov', 'llvm-profdata')) {
            $exe = Join-Path $llvmCompilerHome "bin/$tool.exe"
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw "Missing LLVM instrumentation tool: $exe"
            }
            $version = & $exe --version | Out-String
            if ($LASTEXITCODE -ne 0 -or $version -notmatch '21\.1\.8') {
              throw "Unexpected $tool version: $version"
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $llvmCompilerHome 'lib/clang/21/include/stddef.h') -PathType Leaf)) {
            throw 'Missing LLVM 21.1.8 headers.'
          }
          "UNPACKRAT_LLVM_INSTRUMENTATION=$root" | Add-Content -Path $env:GITHUB_ENV

      - name: Provision source-check tools
        if: inputs.stage == 'source'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Cppcheck is the official x64 2.22.0 MSI, downloaded through gh and hash-verified
          # before it is installed for the source gates.
          $installer = Join-Path $env:RUNNER_TEMP 'cppcheck-2.22.0-x64-Setup.msi'
          gh release download 2.22.0 --repo cppcheck-opensource/cppcheck `
            --pattern 'cppcheck-2.22.0-x64-Setup.msi' --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to download the pinned Cppcheck installer.'
          }
          $expected = '3929162bab7e71d1b9b18708ec054fb0188bfc8ea1660979ed95837f5a9f547b'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expected) {
            throw 'Pinned Cppcheck installer SHA-256 validation failed.'
          }
          $process = Start-Process -FilePath "$env:SystemRoot\System32\msiexec.exe" `
            -ArgumentList @('/i', $installer, '/qn', '/norestart') `
            -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Cppcheck installation failed with exit code $($process.ExitCode)."
          }
          $cppcheck = Join-Path $env:ProgramFiles 'Cppcheck\cppcheck.exe'
          if (-not (Test-Path -LiteralPath $cppcheck -PathType Leaf)) {
            throw "Cppcheck was not found after installation: $cppcheck"
          }
          # The version regex is anchored to the exact tested CLI line, so a longer version such
          # as 2.22.00 can never satisfy it.
          $version = & $cppcheck --version | Out-String
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '(?m)^Cppcheck 2\.22\.0\s*$') {
            throw "Unexpected Cppcheck version: $version"
          }
          (Split-Path -Parent $cppcheck) | Add-Content -Path $env:GITHUB_PATH
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery -Scope CurrentUser -Force

      # The standalone clang-format and clang-tidy come from one pinned, hash-verified LLVM
      # 23.1.3 x64 archive: clang-format feeds the source format gate and clang-tidy feeds the
      # clang-tidy analysis slice. The MSVC build and analysis slices never provision or resolve
      # this tree. The archive ships no 32-bit runtime, so the VS-bundled compiler, coverage and
      # profile tools remain the ones the build uses.
      - name: Restore the pinned LLVM tools
        if: inputs.stage == 'clang-tidy' || inputs.stage == 'source'
        id: llvm-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/unpackrat/tools/llvm/23.1.3
          key: llvm-23.1.3-windows-x64-parallel-cache-v2-9ee6a2192fbb30c776415af529927f76ca6b5d1d55699bb1315f9878e610b5b8

      - name: Provision the pinned LLVM 23.1.3 tools
        if: (inputs.stage == 'clang-tidy' || inputs.stage == 'source') && steps.llvm-tools.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archiveDir = Join-Path $env:RUNNER_TEMP 'llvm-archive'
          New-Item -ItemType Directory -Force -Path $archiveDir | Out-Null
          $asset = 'clang+llvm-23.1.3-x86_64-pc-windows-msvc.tar.xz'
          gh release download llvmorg-23.1.3 --repo llvm/llvm-project --pattern $asset --dir $archiveDir
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to download the pinned LLVM release asset.'
          }
          $archive = Join-Path $archiveDir $asset
          $expected = '9ee6a2192fbb30c776415af529927f76ca6b5d1d55699bb1315f9878e610b5b8'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
            throw 'Pinned LLVM archive SHA-256 validation failed.'
          }
          $env:UNPACKRAT_LLVM_ARCHIVE = $archive
          $env:UNPACKRAT_LLVM_ROOT = Join-Path $env:RUNNER_TEMP 'unpackrat/tools/llvm/23.1.3'
          $python = Join-Path $env:GITHUB_WORKSPACE 'build/.venv/Scripts/python.exe'
          @'
          import os
          from pathlib import Path
          import shutil
          import tarfile

          prefix = 'clang+llvm-23.1.3-x86_64-pc-windows-msvc/'
          wanted = ('bin/clang-tidy.exe', 'bin/clang-format.exe', 'bin/clang-cl.exe',
                    'bin/run-clang-tidy')
          root = Path(os.environ['UNPACKRAT_LLVM_ROOT']).resolve()
          count = 0
          with tarfile.open(os.environ['UNPACKRAT_LLVM_ARCHIVE'], mode='r|xz') as archive:
              for member in archive:
                  if not member.isfile() or not member.name.startswith(prefix):
                      continue
                  relative = member.name[len(prefix):]
                  if relative not in wanted and not relative.startswith('lib/clang/23/include/'):
                      continue
                  target = (root / relative).resolve()
                  if not target.is_relative_to(root):
                      raise ValueError(f'Unsafe LLVM archive member: {member.name}')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with archive.extractfile(member) as source, target.open('wb') as output:
                      shutil.copyfileobj(source, output)
                  count += 1
          if (count < 12 or not (root / 'bin/clang-tidy.exe').is_file() or
                  not (root / 'bin/clang-format.exe').is_file() or
                  not (root / 'bin/clang-cl.exe').is_file() or
                  not (root / 'bin/run-clang-tidy').is_file()):
              raise ValueError(f'Incomplete LLVM extraction: {count} files')
          '@ | & $python -
          if ($LASTEXITCODE -ne 0) {
            throw 'Pinned LLVM extraction failed.'
          }

      - name: Verify pinned clang-tidy and system-header skipping
        if: inputs.stage == 'clang-tidy' || inputs.stage == 'source'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'unpackrat/tools/llvm/23.1.3'
          $tool = Join-Path $root 'bin/clang-tidy.exe'
          $format = Join-Path $root 'bin/clang-format.exe'
          $clangCl = Join-Path $root 'bin/clang-cl.exe'
          $runner = Join-Path $root 'bin/run-clang-tidy'
          if (-not (Test-Path -LiteralPath $tool -PathType Leaf) -or
              -not (Test-Path -LiteralPath $format -PathType Leaf) -or
              -not (Test-Path -LiteralPath $clangCl -PathType Leaf) -or
              -not (Test-Path -LiteralPath $runner -PathType Leaf) -or
              -not (Test-Path -LiteralPath (Join-Path $root 'lib/clang/23/include/stddef.h') -PathType Leaf)) {
            throw 'Pinned LLVM tool cache is incomplete.'
          }
          $version = & $tool --version | Out-String
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '(?m)^\s*LLVM version 23\.1\.3\s*$') {
            throw "Unexpected clang-tidy version: $version"
          }
          $formatVersion = & $format --version | Out-String
          if ($LASTEXITCODE -ne 0 -or $formatVersion -notmatch 'clang-format version 23\.1\.3') {
            throw "Unexpected clang-format version: $formatVersion"
          }
          $clangClVersion = & $clangCl --version | Out-String
          if ($LASTEXITCODE -ne 0 -or $clangClVersion -notmatch 'clang version 23\.1\.3') {
            throw "Unexpected clang-cl version: $clangClVersion"
          }
          # The Release analysis marks restored vcpkg headers with the cl driver's -imsvc.
          # Model that exact cl classification: own.h is an ordinary /I entry, while the same
          # foreign directory is also passed as a compile-db /I and as a clang-cl system
          # include so the analyzer skips its AST matchers there.
          $probe = Join-Path $env:RUNNER_TEMP 'clang-tidy-header-scope'
          $foreign = Join-Path $probe 'foreign headers'
          New-Item -ItemType Directory -Force -Path $foreign | Out-Null
          'inline unsigned own_literal() { return sizeof(42); }' | Set-Content -LiteralPath (Join-Path $probe 'own.h')
          'inline unsigned foreign_literal() { return sizeof(42); }' | Set-Content -LiteralPath (Join-Path $foreign 'foreign.h')
          '#include "own.h"' + "`n" + '#include <foreign.h>' + "`n" +
            'int main() { return 0; }' |
            Set-Content -LiteralPath (Join-Path $probe 'main.cpp')
          $output = & $tool (Join-Path $probe 'main.cpp') '-checks=-*,bugprone-sizeof-expression' `
            '-header-filter=.*' '-system-headers=false' -- '--driver-mode=cl' '/std:c++17' `
            '-Qunused-arguments' '/c' "/I$probe" "/I$foreign" "-imsvc$foreign" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $output -notmatch 'own.h:1:' -or
              $output -match 'foreign.h:1:' -or
              $output -match 'Suppressed \d+ warnings? \(\d+ in non-user code\)') {
            throw "clang-tidy did not skip foreign AST checks while checking our header: $output"
          }
          $visible = & $tool (Join-Path $probe 'main.cpp') '-checks=-*,bugprone-sizeof-expression' `
            '-header-filter=.*' '-system-headers=true' -- '--driver-mode=cl' '/std:c++17' `
            '-Qunused-arguments' '/c' "/I$probe" "/I$foreign" "-imsvc$foreign" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $visible -notmatch 'own.h:1:' -or
              $visible -notmatch 'foreign.h:1:') {
            throw "clang-tidy scope probe failed to recognize the foreign diagnostic: $visible"
          }
          "UNPACKRAT_CLANG_TIDY=$tool" | Add-Content -Path $env:GITHUB_ENV
          "UNPACKRAT_CLANG_FORMAT=$format" | Add-Content -Path $env:GITHUB_ENV

      # The verified tools are cached before any build gate runs, so a later gate failure still
      # leaves a complete, hash-verified tool cache for the next run.
      - name: Save the pinned LLVM tools
        if: (inputs.stage == 'clang-tidy' || inputs.stage == 'source') && steps.llvm-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/unpackrat/tools/llvm/23.1.3
          key: llvm-23.1.3-windows-x64-parallel-cache-v2-9ee6a2192fbb30c776415af529927f76ca6b5d1d55699bb1315f9878e610b5b8

      # The same pinned SARIF Multitool combines PREfast reports and verifies the clang-tidy
      # converter's smoke fixture before either analyzer gate runs.
      - name: Prepare the pinned SARIF merger
        if: inputs.stage == 'msvc-analysis' || inputs.stage == 'clang-tidy'
        shell: pwsh
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP 'sarif-tools'
          dotnet tool install --tool-path $toolPath Sarif.Multitool --version 5.8.0
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to prepare the pinned SARIF merger.'
          }

      # The report converter is separate from the build's pinned Python 3.14 environment.
      # Cache only this CI report tool tree; the analyzer's LLVM cache is unchanged.
      - name: Restore the pinned clang report tools
        if: inputs.stage == 'clang-tidy'
        id: clang-report-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/clang-report-tools
          key: clang-report-cache-v3-2d666fd9333e69a0c48b5d31a64bd360d5984c20-2da736ff05ef065cb2894ac6892e47b5eac2c3c0-857b14271d3ded5511c2e6a60f2dc20c1e4b5680-py3.14.8-lxml6.1.3-pyyaml6.0.3-sariftools3.0.5-jsonpath1.10.1

      - name: Provision the pinned clang report tools
        if: inputs.stage == 'clang-tidy' && steps.clang-report-tools.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'clang-report-tools'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $root 'python'
          uv python install 3.14.8
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Python 3.14.8 preparation failed.' }
          $venv = Join-Path $root 'venv'
          uv venv --python 3.14.8 --python-preference only-managed $venv
          if ($LASTEXITCODE -ne 0) { throw 'Clang report environment creation failed.' }
          $python = Join-Path $venv 'Scripts/python.exe'
          uv pip install --python $python --no-deps 'lxml==6.1.3' 'PyYAML==6.0.3' `
            'sarif-tools==3.0.5' 'jsonpath-ng==1.10.1'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned clang report dependency preparation failed.' }
          $env:UNPACKRAT_REPORT_TOOLS = $root
          @'
          import os
          from pathlib import Path
          import subprocess
          import tarfile

          root = Path(os.environ['UNPACKRAT_REPORT_TOOLS'])
          archive = root / 'codechecker-2d666fd9333e69a0c48b5d31a64bd360d5984c20.tar.gz'
          cache_archive = root / 'ctcache-857b14271d3ded5511c2e6a60f2dc20c1e4b5680.tar.gz'
          source = root / 'filter_sarif.py'
          globber = root / 'globber.py'
          requests = (
              (archive, 'repos/Ericsson/codechecker/tarball/2d666fd9333e69a0c48b5d31a64bd360d5984c20', None),
              (source, 'repos/advanced-security/filter-sarif/contents/filter_sarif.py?ref=2da736ff05ef065cb2894ac6892e47b5eac2c3c0', 'application/vnd.github.raw+json'),
              (globber, 'repos/advanced-security/filter-sarif/contents/globber.py?ref=2da736ff05ef065cb2894ac6892e47b5eac2c3c0', 'application/vnd.github.raw+json'),
              (cache_archive, 'repos/matus-chochlik/ctcache/tarball/857b14271d3ded5511c2e6a60f2dc20c1e4b5680', None),
          )
          for destination, endpoint, accept in requests:
              argv = ['gh', 'api']
              if accept:
                  argv += ['-H', f'Accept: {accept}']
              argv.append(endpoint)
              with destination.open('wb') as output:
                  subprocess.run(argv, stdout=output, check=True)
          with tarfile.open(archive, mode='r:gz') as bundle:
              members = (member for member in bundle if
                         member.name.partition('/')[2].startswith('tools/report-converter/'))
              bundle.extractall(root / 'source', members=members, filter='data')
          with tarfile.open(cache_archive, mode='r:gz') as bundle:
              bundle.extractall(root / 'ctcache-source', filter='data')
          setups = list((root / 'source').rglob('tools/report-converter/setup.py'))
          cache_packages = [path.parent for path in (root / 'ctcache-source').rglob('pyproject.toml')
