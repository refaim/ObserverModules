      - name: Provision the x64 leak-debugging tools
        if: inputs.stage == 'leaks'
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)
          $umdh = Join-Path $programFilesX86 'Windows Kits\10\Debuggers\x64\umdh.exe'
          if (-not (Test-Path -LiteralPath $umdh -PathType Leaf)) {
            $installer = Join-Path $env:RUNNER_TEMP 'winsdksetup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2349110' -OutFile $installer
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
              throw "Windows SDK installer signature validation failed: $($signature.Status)"
            }
            $process = Start-Process -FilePath $installer -ArgumentList @(
              '/features', 'OptionId.WindowsDesktopDebuggers',
              '/quiet', '/norestart', '/ceip', 'off'
            ) -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Windows Debugging Tools installation failed with exit code $($process.ExitCode)."
            }
          }
          if (-not (Test-Path -LiteralPath $umdh -PathType Leaf)) {
            throw "UMDH was not found after Windows Debugging Tools setup: $umdh"
          }

          $root = Join-Path $env:RUNNER_TEMP 'winsdk-19041'
          $extract = Join-Path $root 'extracted'
          $msi = Join-Path $root 'debuggers-x64.msi'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/e119c04b-71aa-4067-ac3c-360c2e13d209/windowssdk/Installers/X64%20Debuggers%20And%20Tools-x64_en-us.msi' -OutFile $msi
          $expected = '354173D844D5C061050EE2638AA94FAFB4835AC3DE836E220F6A74A992849A3B'
          if ((Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash -ne $expected) {
            throw 'Windows 10 Debugging Tools payload hash validation failed.'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $msi
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw "Windows 10 Debugging Tools payload signature validation failed: $($signature.Status)"
          }
          $arguments = @('/a', $msi, '/qn', '/norestart', "TARGETDIR=$extract")
          $process = Start-Process -FilePath "$env:SystemRoot\System32\msiexec.exe" -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Windows 10 Debugging Tools extraction failed with exit code $($process.ExitCode)."
          }
          $debuggers = Join-Path $extract 'Windows Kits\10\Debuggers\x64'
          $umdh = Join-Path $debuggers 'umdh.exe'
          $gflags = Join-Path $debuggers 'gflags.exe'
          if (-not (Test-Path -LiteralPath $umdh -PathType Leaf)) {
            throw "Windows 10 UMDH was not found after setup: $umdh"
          }
          if (-not (Test-Path -LiteralPath $gflags -PathType Leaf)) {
            throw "Windows 10 GFlags was not found after setup: $gflags"
          }
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($umdh).FileVersion
          if (-not $version.StartsWith('10.0.19041.', [StringComparison]::Ordinal)) {
            throw "Unexpected Windows 10 UMDH version: $version"
          }
          "UNPACKRAT_UMDH=$umdh" | Add-Content -Path $env:GITHUB_ENV

      # The leak stage measures a tree this same workflow run already built: it downloads the
      # native-release-x64 Release output (module .so/.pdb plus leak-probe.exe/.pdb) instead of
      # building anything, and never reaches a released binary from another run.
      - name: Collect the verified x64 Release binaries
        if: inputs.stage == 'leaks'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-x64
          path: out/native/bin/x64/Release

      # curl with the Schannel backend aborted the Codecov CLI binary download with
      # "curl: (56) connection closed abruptly" before an upload began. The pinned action's
      # wrapper does not retry that error. A CI-owned curl config adds the single
      # retry-all-errors clause and reaches only the two Codecov upload steps through a
      # step-scoped curl home, so the pinned action, its SHA pin and its fail-closed policy stay
      # untouched. Only the coverage-producing stages publish a report, so only they need it.
      - name: Prepare the Codecov curl retry configuration
        if: inputs.stage == 'source' || inputs.stage == 'coverage'
        shell: pwsh
        run: |
          $curlHome = Join-Path $env:RUNNER_TEMP 'codecov-curl'
          New-Item -ItemType Directory -Force -Path $curlHome | Out-Null
          $curlrc = Join-Path $curlHome '.curlrc'
          [System.IO.File]::WriteAllText($curlrc, "retry-all-errors`n", [System.Text.UTF8Encoding]::new($false))

      - name: Verify the repository sources
        if: inputs.stage == 'source'
        id: source-gate
        shell: pwsh
        run: ./build.ps1 ci-source -Jobs 4

      - name: Verify one stage for one architecture
        if: inputs.stage != 'source' && inputs.stage != 'clang-tidy'
        id: arch-gate
        shell: pwsh
        run: ./build.ps1 ci-arch -Arch '${{ inputs.arch }}' -Stage '${{ inputs.stage }}' -Jobs 4

      - name: Verify clang-tidy and capture its report
        if: inputs.stage == 'clang-tidy'
        id: tidy-gate
        shell: pwsh
        run: |
          $arch = '${{ inputs.arch }}'
          $directory = 'out/native/analysis'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $log = Join-Path $directory "clang-tidy-$arch.log"
          ./build.ps1 ci-arch -Arch $arch -Stage clang-tidy -Jobs 4 *>&1 | Tee-Object -FilePath $log
          $status = $LASTEXITCODE
          if ($status -ne 0) { exit $status }

      - name: Show clang-tidy cache statistics
        if: ${{ always() && inputs.stage == 'clang-tidy' && hashFiles(format('out/native/analysis/clang-tidy-{0}.log', inputs.arch)) != '' }}
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'clang-report-tools/venv/Scripts/clang-tidy-cache.exe'
          & $cache --print-stats
          if ($LASTEXITCODE -ne 0) { throw 'ctcache statistics query failed.' }

      - name: Save reusable clang-tidy cache
        if: success() && inputs.stage == 'clang-tidy' && steps.tidy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/clang-tidy-cache-data/${{ inputs.arch }}/${{ hashFiles('build/main.py', 'build/*.props', 'build/*.targets', 'build/projects/**', 'vcpkg.json', 'vcpkg-configuration.json', 'build/vcpkg/ports/**', 'build/vcpkg/triplets/**') }}
          key: ctcache-v2-857b14271d3ded5511c2e6a60f2dc20c1e4b5680-llvm23.1.3-9ee6a2192fbb30c776415af529927f76ca6b5d1d55699bb1315f9878e610b5b8-v145${{ steps.msvc-toolset.outputs.version }}-sdk10.0.26100.0-${{ steps.runner-image.outputs.identity }}-${{ inputs.arch }}-${{ hashFiles('build/main.py', 'build/*.props', 'build/*.targets', 'build/projects/**', 'vcpkg.json', 'vcpkg-configuration.json', 'build/vcpkg/ports/**', 'build/vcpkg/triplets/**') }}-${{ github.sha }}

      # The vcpkg binary cache is saved only once the gates above have populated it and the job
      # has succeeded, so a failed build never publishes a partial cache.
      - name: Save the vcpkg binary cache
        if: success() && inputs.stage != 'leaks'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ steps.runner-image.outputs.identity }}-${{ inputs.arch == 'none' && 'x64' || inputs.arch }}-${{ (inputs.stage == 'asan' || inputs.stage == 'fuzz') && 'asan' || 'standard' }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'build/vcpkg/ports/**', 'build/vcpkg/triplets/*.cmake') }}

      - name: Upload the Release binaries
        if: inputs.stage == 'native-release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ inputs.arch }}
          path: out/native/bin/${{ inputs.arch }}/Release
          if-no-files-found: error
          retention-days: 30

      - name: Retain the fuzz failure inputs
        if: failure() && inputs.stage == 'fuzz'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure-${{ inputs.arch }}
          path: |
            out/native/fuzz/${{ inputs.arch }}
            crash-*
            oom-*
            timeout-*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ inputs.stage }}-${{ inputs.arch }}-reports
          path: out/native/reports
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the coverage summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ inputs.stage }}-${{ inputs.arch }}-coverage
          path: out/native/coverage
          if-no-files-found: warn
          retention-days: 14

      # A successful analysis gate must have produced a real report. On an earlier gate
      # failure, any report that was written is still published as diagnostic evidence.
      - name: Require completed analysis reports
        if: ${{ success() && (inputs.stage == 'source' || inputs.stage == 'msvc-analysis' || inputs.stage == 'clang-tidy') }}
        shell: pwsh
        run: |
          if ('${{ inputs.stage }}' -eq 'source') {
            if (-not (Test-Path -LiteralPath 'out/native/analysis/cppcheck.sarif' -PathType Leaf)) {
              throw 'Cppcheck completed without its SARIF report.'
            }
          } elseif ('${{ inputs.stage }}' -eq 'msvc-analysis') {
            $root = 'out/native/obj-analysis/${{ inputs.arch }}/Release'
            $reports = @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter '*.sarif' -ErrorAction SilentlyContinue)
            if ($reports.Count -eq 0) {
              throw 'MSVC analysis completed without PREfast SARIF reports.'
            }
          } else {
            if (-not (Test-Path -LiteralPath 'out/native/analysis/clang-tidy-${{ inputs.arch }}.log' -PathType Leaf)) {
              throw 'clang-tidy completed without its full-stage diagnostic log.'
            }
            if (-not (Test-Path -LiteralPath 'out/native/analysis/clang-tidy-${{ inputs.arch }}.complete' -PathType Leaf)) {
              throw 'clang-tidy completed without scanning every selected project.'
            }
          }

      - name: Merge the MSVC analysis reports
        if: ${{ always() && inputs.stage == 'msvc-analysis' && hashFiles(format('out/native/obj-analysis/{0}/Release/**/*.sarif', inputs.arch)) != '' }}
        shell: pwsh
        run: |
          $arch = '${{ inputs.arch }}'
          $sarif = Join-Path $env:RUNNER_TEMP 'sarif-tools/sarif.exe'
          New-Item -ItemType Directory -Force -Path 'out/native/analysis' | Out-Null
          & $sarif merge "out/native/obj-analysis/$arch/Release/*.sarif" --recurse --merge-empty-logs --output-directory out/native/analysis --output-file "msvc-$arch.sarif"
          if ($LASTEXITCODE -ne 0) {
            throw 'MSVC SARIF merge failed.'
          }

      # The converter reads the whole original stage log once. It emits no file for a clean
      # gate, so only a successful, complete gate may receive the upstream serializer's empty run.
      # The filter drops just the converter's duplicate pseudo-ID for a compiler option;
      # clang-tidy's strict verdict and every real checker result remain unchanged.
      - name: Convert the clang-tidy diagnostics to Code Scanning SARIF
        if: ${{ always() && inputs.stage == 'clang-tidy' && hashFiles(format('out/native/analysis/clang-tidy-{0}.log', inputs.arch)) != '' }}
        shell: pwsh
        run: |
          Remove-Item Env:CC_DATA_FILES_DIR -ErrorAction SilentlyContinue
          $arch = '${{ inputs.arch }}'
          $root = Join-Path $env:RUNNER_TEMP 'clang-report-tools'
          $python = Join-Path $root 'venv/Scripts/python.exe'
          $converter = Join-Path $root 'venv/Scripts/report-converter.exe'
          $filter = Join-Path $root 'filter_sarif.py'
          $sarif = Join-Path $env:RUNNER_TEMP 'sarif-tools/sarif.exe'
          $analysis = 'out/native/analysis'
          $log = Join-Path $analysis "clang-tidy-$arch.log"
          $raw = Join-Path $analysis "clang-tidy-$arch-raw"
          New-Item -ItemType Directory -Force -Path $raw | Out-Null
          & $converter -t clang-tidy -e sarif -o $raw $log
          if ($LASTEXITCODE -ne 0) { throw 'clang-tidy SARIF conversion failed.' }
          $reports = @(Get-ChildItem -LiteralPath $raw -Recurse -File -Filter '*.sarif')
          if ($reports.Count -eq 0) {
            if ('${{ steps.tidy-gate.outcome }}' -ne 'success') {
              throw 'A failed clang-tidy gate produced no report; refusing a clean baseline.'
            }
            $env:UNPACKRAT_EMPTY_SARIF = Join-Path $raw 'clean.sarif'
            @'
          import json
          import os
          from pathlib import Path
          from codechecker_report_converter.report.parser.sarif import Parser

          with Path(os.environ['UNPACKRAT_EMPTY_SARIF']).open('w', encoding='utf-8') as output:
              json.dump(Parser().convert([]), output, ensure_ascii=False)
          '@ | & $python -
            if ($LASTEXITCODE -ne 0) { throw 'Clean clang-tidy SARIF serialization failed.' }
          }
          & $sarif merge "$raw/*.sarif" --recurse --merge-empty-logs `
            --output-directory $analysis --output-file "clang-tidy-$arch-merged.sarif"
          if ($LASTEXITCODE -ne 0) { throw 'clang-tidy SARIF merge failed.' }
          $base = "$env:GITHUB_WORKSPACE$([IO.Path]::DirectorySeparatorChar)"
          $github = Join-Path $analysis "clang-tidy-$arch-github.sarif"
          & $sarif rewrite (Join-Path $analysis "clang-tidy-$arch-merged.sarif") --output $github `
            --normalize-for-ghas --base-path-value $base --base-path-token SRCROOT
          if ($LASTEXITCODE -ne 0) { throw 'clang-tidy SARIF path rewrite failed.' }
          $published = Join-Path $analysis "clang-tidy-$arch.sarif"
          & $python $filter --input $github --output $published --split-lines -- '-**:-warnings-as-errors'
          if ($LASTEXITCODE -ne 0) { throw 'clang-tidy SARIF pseudo-ID filter failed.' }
          & $sarif validate $published
          if ($LASTEXITCODE -ne 0) { throw 'clang-tidy SARIF validation failed.' }

      - name: Upload the source analysis to Code Scanning
        if: ${{ always() && inputs.stage == 'source' && hashFiles('out/native/analysis/cppcheck.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: out/native/analysis/cppcheck.sarif
          checkout_path: ${{ github.workspace }}
          category: cppcheck-source

      - name: Upload the MSVC analysis to Code Scanning
        if: ${{ always() && inputs.stage == 'msvc-analysis' && hashFiles(format('out/native/analysis/msvc-{0}.sarif', inputs.arch)) != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: out/native/analysis/msvc-${{ inputs.arch }}.sarif
          checkout_path: ${{ github.workspace }}
          category: msvc-analysis-${{ inputs.arch }}

      - name: Upload the clang-tidy analysis to Code Scanning
        if: ${{ always() && inputs.stage == 'clang-tidy' && hashFiles(format('out/native/analysis/clang-tidy-{0}.complete', inputs.arch)) != '' && hashFiles(format('out/native/analysis/clang-tidy-{0}.sarif', inputs.arch)) != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: out/native/analysis/clang-tidy-${{ inputs.arch }}.sarif
          checkout_path: ${{ github.workspace }}
          category: clang-tidy-${{ inputs.arch }}

      - name: Retain the analysis SARIF artifacts
        if: ${{ always() && (inputs.stage == 'source' || inputs.stage == 'msvc-analysis' || inputs.stage == 'clang-tidy') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ inputs.stage }}-${{ inputs.arch }}-analysis
          path: |
            out/native/analysis/*.sarif
            out/native/analysis/*.log
            out/native/analysis/*.complete
            out/native/analysis/clang-tidy-*-raw/**/*.sarif
            out/native/obj-analysis/**/*.sarif
          if-no-files-found: warn
          retention-days: 14

      # Each report uploads under its own flag. The reports are written before the local gates
      # fail, so an always-run upload still publishes the evidence for an incomplete run while the
      # job keeps its original failure. OIDC covers same-repo runs; a cross-repo pull request
      # cannot assume id-token, so it falls back to Codecov's tokenless public-fork path.
      - name: Upload the python coverage to Codecov
        if: ${{ always() && inputs.stage == 'source' && hashFiles('out/native/coverage/python/coverage.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CURL_HOME: ${{ runner.temp }}/codecov-curl
        with:
          files: out/native/coverage/python/coverage.xml
          flags: python
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          disable_search: true
          fail_ci_if_error: true

      - name: Upload the native coverage to Codecov
        if: ${{ always() && inputs.stage == 'coverage' && hashFiles(format('out/native/coverage/{0}/coverage.lcov', inputs.arch)) != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CURL_HOME: ${{ runner.temp }}/codecov-curl
        with:
          files: out/native/coverage/${{ inputs.arch }}/coverage.lcov
          flags: native-${{ inputs.arch }}
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          disable_search: true
          fail_ci_if_error: true
