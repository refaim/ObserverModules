      - name: Verify the cached clang report tools
        if: inputs.stage == 'clang-tidy'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'clang-report-tools'
          $python = Join-Path $root 'venv/Scripts/python.exe'
          $converter = Join-Path $root 'venv/Scripts/report-converter.exe'
          $cache = Join-Path $root 'venv/Scripts/clang-tidy-cache.exe'
          $filter = Join-Path $root 'filter_sarif.py'
          $globber = Join-Path $root 'globber.py'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf) -or
              -not (Test-Path -LiteralPath $converter -PathType Leaf) -or
              -not (Test-Path -LiteralPath $cache -PathType Leaf) -or
              -not (Test-Path -LiteralPath $filter -PathType Leaf) -or
