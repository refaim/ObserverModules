          & $converter -t clang-tidy -e sarif -o $raw $log
          if ($LASTEXITCODE -ne 0) { throw 'Clang report fixture conversion failed.' }
          $sarif = Join-Path $env:RUNNER_TEMP 'sarif-tools/sarif.exe'
          & $sarif merge "$raw/*.sarif" --recurse --merge-empty-logs `
            --output-directory $fixture --output-file merged.sarif
          if ($LASTEXITCODE -ne 0) { throw 'Clang report fixture merge failed.' }
          $base = "$fixture$([IO.Path]::DirectorySeparatorChar)"
          $github = Join-Path $fixture 'github.sarif'
