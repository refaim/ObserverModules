name: CI instrumentation toolchain

# A matched official LLVM21 pair supplies x64 host tools and x86/x64 compiler-rt.
# Provisioning is confined to ephemeral CI runners; local installations remain operator-owned.
on:
  workflow_call:

jobs:
  instrumentation-tools:
    name: instrumentation-tools
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the pinned LLVM 21.1.8 toolchain
        id: llvm-instrumentation
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/unpackrat/tools/llvm/21.1.8
          key: llvm-instrumentation-21.1.8-lld-link-v1-0492c5c292e515ebbbc2533671e54c5895fe209e534812313f64257407233181-7a5386c26497db1691f320121e5b113364dd0274b98e55f15f4dbc00c0450113

      - name: Provision the pinned LLVM 21.1.8 toolchain
        if: steps.llvm-instrumentation.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'unpackrat/tools/llvm/21.1.8'
          $downloads = Join-Path $env:RUNNER_TEMP 'llvm-21.1.8-payloads'
          New-Item -ItemType Directory -Force -Path $downloads | Out-Null
          $payloads = @(
            @{ Arch = 'x86'; Name = 'LLVM-21.1.8-win32.exe'; Sha = '0492c5c292e515ebbbc2533671e54c5895fe209e534812313f64257407233181'; Size = 349589289 },
            @{ Arch = 'x64'; Name = 'LLVM-21.1.8-win64.exe'; Sha = '7a5386c26497db1691f320121e5b113364dd0274b98e55f15f4dbc00c0450113'; Size = 374129373 }
          )
          foreach ($payload in $payloads) {
            gh release download llvmorg-21.1.8 --repo llvm/llvm-project --pattern $payload.Name --dir $downloads
            if ($LASTEXITCODE -ne 0) { throw 'Pinned LLVM download failed.' }
            $file = Join-Path $downloads $payload.Name
            if ((Get-Item -LiteralPath $file).Length -ne $payload.Size) { throw 'Unexpected LLVM payload size.' }
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $payload.Sha) {
              throw 'Pinned LLVM SHA-256 validation failed.'
            }
            $destination = Join-Path $root $payload.Arch
            # The installed archiver reads the official NSIS container without running its installer.
            & 7z x $file "-o$destination" '-r' '-y' 'bin/clang-cl.exe' 'bin/lld-link.exe' 'bin/llvm-cov.exe' `
              'bin/llvm-profdata.exe' 'bin/*.dll' 'lib/clang/21/*'
            if ($LASTEXITCODE -ne 0) { throw 'Pinned LLVM extraction failed.' }
          }

      - name: Verify the pinned LLVM 21.1.8 toolchain
        shell: pwsh
        env:
          LLVM_ROOT: ${{ runner.temp }}/unpackrat/tools/llvm/21.1.8
        run: |
          $root = $env:LLVM_ROOT
          $llvmCompilerHome = Join-Path $root 'x64'
          foreach ($architecture in @('x86', 'x64')) {
            foreach ($tool in @('clang-cl', 'lld-link', 'llvm-cov', 'llvm-profdata')) {
              $exe = Join-Path $root "$architecture/bin/$tool.exe"
              if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Missing LLVM tool: $exe" }
              $version = & $exe --version | Out-String
              if ($LASTEXITCODE -ne 0 -or $version -notmatch '21\.1\.8(?!\d)') {
                throw "Unexpected $tool version: $version"
              }
            }
          }
          $libraries = @(
            'x64/lib/clang/21/lib/windows/clang_rt.profile-x86_64.lib',
            'x64/lib/clang/21/lib/windows/clang_rt.fuzzer-x86_64.lib',
            'x64/lib/clang/21/lib/windows/clang_rt.asan_dynamic-x86_64.lib',
            'x64/lib/clang/21/lib/windows/clang_rt.asan_static_runtime_thunk-x86_64.lib',
            'x64/lib/clang/21/lib/windows/clang_rt.asan_dynamic-x86_64.dll',
            'x64/lib/clang/21/lib/windows/clang_rt.ubsan_standalone-x86_64.lib',
            'x64/lib/clang/21/lib/windows/clang_rt.ubsan_standalone_cxx-x86_64.lib',
            'x86/lib/clang/21/lib/windows/clang_rt.profile-i386.lib',
            'x86/lib/clang/21/lib/windows/clang_rt.fuzzer-i386.lib',
            'x86/lib/clang/21/lib/windows/clang_rt.asan_dynamic-i386.lib',
            'x86/lib/clang/21/lib/windows/clang_rt.asan_static_runtime_thunk-i386.lib',
            'x86/lib/clang/21/lib/windows/clang_rt.asan_dynamic-i386.dll'
          )
          foreach ($library in $libraries) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $library) -PathType Leaf)) {
              throw "Missing LLVM instrumentation library: $library"
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $llvmCompilerHome 'lib/clang/21/include/stddef.h') -PathType Leaf)) {
            throw 'Missing LLVM 21.1.8 headers.'
          }

      - name: Save the pinned LLVM 21.1.8 toolchain
        if: steps.llvm-instrumentation.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/unpackrat/tools/llvm/21.1.8
          key: llvm-instrumentation-21.1.8-lld-link-v1-0492c5c292e515ebbbc2533671e54c5895fe209e534812313f64257407233181-7a5386c26497db1691f320121e5b113364dd0274b98e55f15f4dbc00c0450113

      - name: Upload the LLVM 21.1.8 instrumentation toolchain
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llvm-instrumentation-21.1.8
          path: ${{ runner.temp }}/unpackrat/tools/llvm/21.1.8
          if-no-files-found: error
          retention-days: 7
