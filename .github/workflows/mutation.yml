name: Mutation testing

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/mutation.yml'
      - 'build/mutation/**'
      - 'build/tests/test_mutation_report.py'
      - 'src/modules/renpy/pickle.*'
      - 'src/tests/unit/pickle.cpp'
      - 'src/tests/mutation/**'
      - 'vcpkg.json'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/mutation.yml'
      - 'build/mutation/**'
      - 'build/tests/test_mutation_report.py'
      - 'src/modules/renpy/pickle.*'
      - 'src/tests/unit/pickle.cpp'
      - 'src/tests/mutation/**'
      - 'vcpkg.json'
  schedule:
    - cron: '41 19 * * 6'
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MULL_VERSION: '0.34.0'
  MULL_LLVM: '19'
  MULL_REPOSITORY_FINGERPRINT: '6975C1E8A078A727081F4B7541DB35380DE6BD6F'
  VCPKG_COMMIT: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
  VCPKG_INSTALLED_DIR: ${{ github.workspace }}/.artifacts/vcpkg-installed

jobs:
  pickle-core:
    name: Portable pickle core (Mull)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out ObserverModules
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Test mutation-report enforcement
        shell: bash
        run: python3 -m unittest build.tests.test_mutation_report -v

      - name: Check out pinned vcpkg baseline
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .artifacts/vcpkg-src
          persist-credentials: false

      - name: Install pinned Mull toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ca-certificates curl gnupg

          key_file="${RUNNER_TEMP}/mull-project.asc"
          keyring_file="${RUNNER_TEMP}/mull-project.gpg"
          curl --fail --location --proto '=https' --tlsv1.2 \
            'https://dl.cloudsmith.io/public/mull-project/mull-stable/gpg.41DB35380DE6BD6F.key' \
            --output "${key_file}"
          actual_fingerprint="$(gpg --show-keys --with-colons "${key_file}" | awk -F: '$1 == "fpr" { print toupper($10); exit }')"
          test "${actual_fingerprint}" = "${MULL_REPOSITORY_FINGERPRINT}"
          gpg --batch --yes --dearmor --output "${keyring_file}" "${key_file}"
          sudo install -o root -g root -m 0644 "${keyring_file}" /usr/share/keyrings/mull-project.gpg
          echo 'deb [signed-by=/usr/share/keyrings/mull-project.gpg] https://dl.cloudsmith.io/public/mull-project/mull-stable/deb/ubuntu noble main' \
            | sudo tee /etc/apt/sources.list.d/mull-project.list >/dev/null

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            "clang-${MULL_LLVM}" \
            "mull-${MULL_LLVM}=${MULL_VERSION}"
          "mull-runner-${MULL_LLVM}" --version
          "clang++-${MULL_LLVM}" --version

      - name: Restore pinned Catch2 dependency
        shell: bash
        run: |
          set -euo pipefail
          .artifacts/vcpkg-src/bootstrap-vcpkg.sh -disableMetrics
          .artifacts/vcpkg-src/vcpkg install catch2:x64-linux \
            --x-install-root="${VCPKG_INSTALLED_DIR}" \
            --clean-after-build

      - name: Run portable mutation gate
        id: mutation
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .artifacts/reports/mutation
          bash build/mutation/run.sh > .artifacts/reports/mutation/ci.log 2>&1

      - name: Archive mutation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-pickle-core
          path: .artifacts/reports/mutation
          if-no-files-found: error
          retention-days: 30

      - name: Enforce mutation gate
        if: steps.mutation.outcome == 'failure'
        shell: bash
        run: exit 1
