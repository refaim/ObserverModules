name: CI

on:
  push:
    branches: [master]
    # A module release is published by manually pushing a renpy/vX.Y.Z, rpgmaker/vX.Y.Z or
    # zanzarah/vX.Y.Z tag. Each tag selects exactly one module's three release archives.
    tags: ['renpy/v*', 'rpgmaker/v*', 'zanzarah/v*']
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # One independent slice per stage and architecture, so the slow native build of one
  # architecture never waits on another job and each slice can fail on its own. Every slice
  # reuses the single maintained setup workflow, and these real jobs are the required check
  # names directly: branch protection requires each of them, with no aggregate gate re-scoring
  # their results.
  source-checks:
    name: source-checks
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
      id-token: write
    with:
      arch: none
      stage: source

  native-x86:
    name: native-x86
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
    with:
      arch: x86
      stage: native

  native-x64:
    name: native-x64
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
    with:
      arch: x64
      stage: native

  coverage-x86:
    name: coverage-x86
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
      id-token: write
    with:
      arch: x86
      stage: coverage

  coverage-x64:
    name: coverage-x64
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
      id-token: write
    with:
      arch: x64
      stage: coverage

  asan-x86:
    name: asan-x86
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
    with:
      arch: x86
      stage: asan

  asan-x64:
    name: asan-x64
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
    with:
      arch: x64
      stage: asan

  ubsan-x64:
    name: ubsan-x64
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
    with:
      arch: x64
      stage: ubsan

  fuzz-x86:
    name: fuzz-x86
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
    with:
      arch: x86
      stage: fuzz

  fuzz-x64:
    name: fuzz-x64
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
    with:
      arch: x64
      stage: fuzz

  # The leak measurement reuses the x64 Release output this same run already built: it downloads
  # the native-x64 artifact and never touches another run's binaries.
  leaks-x64:
    name: leaks-x64
    needs: native-x64
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
    with:
      arch: x64
      stage: leaks

  packaging:
    name: packaging
    needs: [source-checks, native-x86, native-x64, coverage-x86, coverage-x64, asan-x86, asan-x64, ubsan-x64, fuzz-x86, fuzz-x64, leaks-x64]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: build/uv.lock
          cache-suffix: packaging

      - name: Prepare the pinned Python environment
        shell: pwsh
        run: uv sync --project build --frozen

      - name: Collect the verified x86 Release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-x86
          path: out/native/bin/x86/Release

      - name: Collect the verified x64 Release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-x64
          path: out/native/bin/x64/Release

      - name: Package the Release outputs
        shell: pwsh
        run: ./build.ps1 package -Output out/packages

      - name: Upload the module archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages
          path: out/packages/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: release
    needs: packaging
    if: startsWith(github.ref, 'refs/tags/renpy/v') || startsWith(github.ref, 'refs/tags/rpgmaker/v') || startsWith(github.ref, 'refs/tags/zanzarah/v')
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Collect the module archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: packages

      - name: Publish the module release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $module = $env:GITHUB_REF_NAME.Split('/')[0]
          $version = $env:GITHUB_REF_NAME.Split('/')[1].TrimStart('v')
          $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          $latest = {
            param([string] $Path)
            $section = [System.Collections.Generic.List[string]]::new()
            $started = $false
            foreach ($line in (Get-Content -LiteralPath $Path)) {
              if ($line -match '^(Version|Версия)\s') {
                if ($started) { break }
                $started = $true
              }
              if ($started) { [void] $section.Add($line) }
            }
            ($section -join "`n")
          }
          $en = & $latest "src/modules/$module/ChangeLog.en.txt"
          $ru = & $latest "src/modules/$module/ChangeLog.ru.txt"
          "$en`n`n$ru" | Set-Content -LiteralPath $notes -Encoding utf8
          $archives = @(
            "packages/$module-$version-bin-x64.zip"
            "packages/$module-$version-bin-x86.zip"
            "packages/$module-$version-pdb.zip"
          )
          gh release create $env:GITHUB_REF_NAME --verify-tag --title "$module $version" --notes-file $notes @archives
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to publish the release $env:GITHUB_REF_NAME."
          }
