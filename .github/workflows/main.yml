name: CI

on:
  push:
    branches: [master]
    # A module release is published by manually pushing a renpy/vX.Y.Z, rpgmaker/vX.Y.Z or
    # zanzarah/vX.Y.Z tag. Each tag selects exactly one module and its own version lineage.
    tags: ['renpy/v*', 'rpgmaker/v*', 'zanzarah/v*']
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  VCPKG_ROOT: C:\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-binary-cache

jobs:
  verification:
    name: ${{ matrix.job }}
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: source
            arch: none
          - job: x86
            arch: x86
          - job: x64
            arch: x64
          - job: arm64
            arch: arm64

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: build/uv.lock
          cache-suffix: ${{ matrix.job }}

      - name: Identify the hosted runner image
        id: runner-image
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ImageOS) -or
              [string]::IsNullOrWhiteSpace($env:ImageVersion)) {
            throw 'GitHub runner image identity is unavailable.'
          }
          "identity=$($env:ImageOS)-$($env:ImageVersion)" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Cache vcpkg binaries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ steps.runner-image.outputs.identity }}-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'build/vcpkg/triplets/*.cmake') }}

      - name: Prepare the pinned Python environment
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" | Add-Content -Path $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" | Add-Content -Path $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $baseline = (Get-Content -Raw -LiteralPath 'vcpkg.json' | ConvertFrom-Json).'builtin-baseline'
          if ($baseline -notmatch '^[0-9a-f]{40}$') {
            throw "Invalid vcpkg builtin baseline: $baseline"
          }
          git -C $env:VCPKG_ROOT cat-file -e "$baseline^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git -C $env:VCPKG_ROOT fetch --no-tags --depth=1 origin $baseline
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to fetch vcpkg baseline $baseline."
            }
          }
          git -C $env:VCPKG_ROOT -c advice.detachedHead=false `
            checkout --detach --force $baseline
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to check out vcpkg baseline $baseline."
          }
          & (Join-Path $env:VCPKG_ROOT 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to bootstrap vcpkg baseline $baseline."
          }
          uv sync --project build --frozen

      - name: Provision source-check tools
        shell: pwsh
        run: |
          choco install cppcheck --version=2.19.0 --yes --no-progress
          $cppcheck = 'C:\Program Files\Cppcheck\cppcheck.exe'
          if (-not (Test-Path -LiteralPath $cppcheck -PathType Leaf)) {
            throw "Cppcheck was not found after installation: $cppcheck"
          }
          (Split-Path -Parent $cppcheck) | Add-Content -Path $env:GITHUB_PATH
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery -Scope CurrentUser -Force

      - name: Provision binary-analysis tools
        if: matrix.job != 'source'
        shell: pwsh
        run: |
          $binskimRoot = Join-Path $env:RUNNER_TEMP 'binskim'
          nuget install Microsoft.CodeAnalysis.BinSkim -Version 4.4.9.11 `
            -OutputDirectory $binskimRoot -DirectDownload -NonInteractive
          $binskim = Join-Path $binskimRoot `
            'Microsoft.CodeAnalysis.BinSkim.4.4.9.11\tools\net9.0\win-x64\BinSkim.exe'
          if (-not (Test-Path -LiteralPath $binskim -PathType Leaf)) {
            throw "BinSkim was not found after installation: $binskim"
          }
          (Split-Path -Parent $binskim) | Add-Content -Path $env:GITHUB_PATH

      - name: Provision the x64 leak-debugging tools
        if: matrix.job == 'x64'
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)
          $umdh = Join-Path $programFilesX86 'Windows Kits\10\Debuggers\x64\umdh.exe'
          if (-not (Test-Path -LiteralPath $umdh -PathType Leaf)) {
            $installer = Join-Path $env:RUNNER_TEMP 'winsdksetup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2349110' -OutFile $installer
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
              throw "Windows SDK installer signature validation failed: $($signature.Status)"
            }
            $process = Start-Process -FilePath $installer -ArgumentList @(
              '/features', 'OptionId.WindowsDesktopDebuggers',
              '/quiet', '/norestart', '/ceip', 'off'
            ) -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Windows Debugging Tools installation failed with exit code $($process.ExitCode)."
            }
          }
          if (-not (Test-Path -LiteralPath $umdh -PathType Leaf)) {
            throw "UMDH was not found after Windows Debugging Tools setup: $umdh"
          }

          $root = Join-Path $env:RUNNER_TEMP 'winsdk-19041'
          $extract = Join-Path $root 'extracted'
          $msi = Join-Path $root 'debuggers-x64.msi'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/e119c04b-71aa-4067-ac3c-360c2e13d209/windowssdk/Installers/X64%20Debuggers%20And%20Tools-x64_en-us.msi' -OutFile $msi
          $expected = '354173D844D5C061050EE2638AA94FAFB4835AC3DE836E220F6A74A992849A3B'
          if ((Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash -ne $expected) {
            throw 'Windows 10 Debugging Tools payload hash validation failed.'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $msi
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw "Windows 10 Debugging Tools payload signature validation failed: $($signature.Status)"
          }
          $arguments = @('/a', $msi, '/qn', '/norestart', "TARGETDIR=$extract")
          $process = Start-Process -FilePath "$env:SystemRoot\System32\msiexec.exe" -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Windows 10 Debugging Tools extraction failed with exit code $($process.ExitCode)."
          }
          $debuggers = Join-Path $extract 'Windows Kits\10\Debuggers\x64'
          $umdh = Join-Path $debuggers 'umdh.exe'
          $gflags = Join-Path $debuggers 'gflags.exe'
          if (-not (Test-Path -LiteralPath $umdh -PathType Leaf)) {
            throw "Windows 10 UMDH was not found after setup: $umdh"
          }
          if (-not (Test-Path -LiteralPath $gflags -PathType Leaf)) {
            throw "Windows 10 GFlags was not found after setup: $gflags"
          }
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($umdh).FileVersion
          if (-not $version.StartsWith('10.0.19041.', [StringComparison]::Ordinal)) {
            throw "Unexpected Windows 10 UMDH version: $version"
          }
          "UNPACKRAT_UMDH=$umdh" | Add-Content -Path $env:GITHUB_ENV

      - name: Verify repository sources
        id: verify-source
        if: matrix.job == 'source'
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'evidence-source'
          ./build.ps1 verify-source -ExportDir $evidence -Priority normal

      - name: Verify one architecture
        id: verify-arch
        if: matrix.job != 'source'
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'evidence-${{ matrix.job }}'
          $fuzzSeconds = if ('${{ github.event_name }}' -eq 'pull_request') { 5 } else { 60 }
          $leakWarmup = if ('${{ github.event_name }}' -eq 'pull_request') { 1 } else { 8 }
          $leakIterations = if ('${{ github.event_name }}' -eq 'pull_request') { 1 } else { 100 }
          ./build.ps1 verify-arch -Arch '${{ matrix.arch }}' -ExportDir $evidence `
            -FuzzSeconds $fuzzSeconds -LeakWarmup $leakWarmup `
            -LeakIterations $leakIterations -LeakWindows 3 -Priority normal

      - name: Upload verification evidence
        if: always() && (steps.verify-source.outcome != 'skipped' || steps.verify-arch.outcome != 'skipped')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-${{ matrix.job }}
          path: |
            ${{ runner.temp }}/evidence-${{ matrix.job }}/manifest.json
            ${{ runner.temp }}/evidence-${{ matrix.job }}/reports
            ${{ runner.temp }}/evidence-${{ matrix.job }}/logs
          if-no-files-found: error
          include-hidden-files: true
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

      - name: Upload verified packages and symbols
        if: success() && github.event_name == 'push' && matrix.job != 'source'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages-${{ matrix.job }}
          path: ${{ runner.temp }}/evidence-${{ matrix.job }}/packages
          if-no-files-found: error
          retention-days: 30

  release:
    name: release
    needs: verification
    if: startsWith(github.ref, 'refs/tags/renpy/v') || startsWith(github.ref, 'refs/tags/rpgmaker/v') || startsWith(github.ref, 'refs/tags/zanzarah/v')
    # Serialize fresh publications of the same module so two releases cannot race the history
    # lookup, the version gate and the publish. A job-level group cannot read step outputs, so
    # the module comes from github.ref_name; cancel-in-progress is off so a running publication
    # is never killed.
    concurrency:
      group: release-${{ startsWith(github.ref_name, 'renpy/') && 'renpy' || startsWith(github.ref_name, 'rpgmaker/') && 'rpgmaker' || 'zanzarah' }}
      cancel-in-progress: false
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: build/uv.lock
          cache-suffix: release

      - name: Prepare the pinned Python environment
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" | Add-Content -Path $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" | Add-Content -Path $env:GITHUB_ENV
          uv sync --project build --frozen

      - name: Collect the verified evidence and package bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Resolve the selected module from the release tag
        id: tag
        shell: pwsh
        run: |
          # `uv run --directory build` changes the working directory, so a relative --repository
          # would validate build/src instead of the checked out repository root.
          uv run --directory build --frozen --no-sync python -m core.release tag `
            --repository "$env:GITHUB_WORKSPACE" --tag $env:GITHUB_REF_NAME `
            --github-output $env:GITHUB_OUTPUT

      - name: Resolve the previous release of the same module
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = '${{ github.repository }}'
          $tag = $env:GITHUB_REF_NAME
          # The exact tag is probed before any lineage work: only a confirmed HTTP 404 means the
          # release does not exist yet, and every other failure is fatal. The captured output is
          # joined into one string so a 404 body line cannot hide the status.
          $probe = (gh api "repos/$repo/releases/tags/$tag" --jq '.tag_name' 2>&1 | Out-String)
          $exists = $LASTEXITCODE -eq 0
          if (-not $exists -and $probe -notmatch 'HTTP 404') {
            throw "Unable to determine whether $tag is already published:`n$probe"
          }
          "exists=$($exists.ToString().ToLower())" | Add-Content -Path $env:GITHUB_OUTPUT
          $resolved = Join-Path $env:RUNNER_TEMP 'previous-tag.txt'
          if ($exists) {
            # A rerun never reconstructs the lineage from the mutable history: it downloads the
            # immutable release.json published with the tag and reuses the predecessor recorded
            # there, so a concurrent or hand-inserted release cannot change the comparison.
            $current = Join-Path $env:RUNNER_TEMP 'current'
            New-Item -ItemType Directory -Force -Path $current | Out-Null
            gh release download $tag --pattern 'release.json' --dir $current
            if ($LASTEXITCODE -ne 0) {
              throw "The published release $tag publishes no readable release.json."
            }
            uv run --directory build --frozen --no-sync python -m core.release previous `
              --tag $tag --current-exists --current-report (Join-Path $current 'release.json') `
              --output $resolved
          }
          else {
            # Every page of the release history is scanned so an older lineage never disappears
            # behind a fixed page of newer releases. Draft and prerelease entries are emitted too
            # and filtered out by the lineage helper.
            $listing = Join-Path $env:RUNNER_TEMP 'releases.jsonl'
            New-Item -ItemType File -Force -Path $listing | Out-Null
            gh api --paginate "repos/$repo/releases?per_page=100" `
              --jq '.[] | {tag: .tag_name, draft: .draft, prerelease: .prerelease}' |
              Set-Content -LiteralPath $listing
            if ($LASTEXITCODE -ne 0) {
              throw 'Unable to list the published releases.'
            }
            uv run --directory build --frozen --no-sync python -m core.release previous `
              --tag $tag --releases $listing --output $resolved
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to resolve the previous release of this module.'
          }
          # The resolved predecessor is written as a bare tag; an empty file means a first release.
          $previous = (Get-Content -Raw -LiteralPath $resolved).Trim()
          $manifest = ''
          if (-not [string]::IsNullOrWhiteSpace($previous)) {
            $directory = Join-Path $env:RUNNER_TEMP 'previous'
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
            gh release download $previous --pattern 'packages.json' --dir $directory
            if ($LASTEXITCODE -ne 0) {
              throw "The previous module release $previous publishes no readable packages.json."
            }
            $manifest = Join-Path $directory 'packages.json'
          }
          "manifest=$manifest" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Gate the selected module through the public build tool
        shell: pwsh
        env:
          MODULE: ${{ steps.tag.outputs.module }}
          PREVIOUS_MANIFEST: ${{ steps.previous.outputs.manifest }}
        run: |
          $downloads = Join-Path $env:RUNNER_TEMP 'artifacts'
          $gate = Join-Path $env:RUNNER_TEMP 'release-gate'
          $assets = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Force -Path $gate, $assets | Out-Null
          $manifests = @(
            foreach ($arch in @('x86', 'x64', 'arm64')) {
              $path = Join-Path $downloads "packages-$arch\packages.json"
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                throw "A verified package manifest is missing: $path"
              }
              $path
            }
          )
          Get-ChildItem -LiteralPath $downloads -Directory -Filter 'packages-*' |
            ForEach-Object { Get-ChildItem -LiteralPath $_.FullName -Filter '*.zip' } |
            Where-Object { $_.Name.StartsWith("$env:MODULE-", [StringComparison]::Ordinal) } |
            # Every architecture ships the same intermediate symbol bundle name, so the
            # per-architecture PDB bundles stay beside their own packages.json and only the
            # module archives are copied flat; the gate assembles the final bundle.
            Where-Object { -not $_.Name.EndsWith('-pdb.zip', [StringComparison]::Ordinal) } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $assets }
          $previous = @()
          if (-not [string]::IsNullOrWhiteSpace($env:PREVIOUS_MANIFEST)) {
            $previous = @('--previous', $env:PREVIOUS_MANIFEST)
          }
          uv run --directory build --frozen --no-sync python -m core.release gate `
            --module $env:MODULE --tag $env:GITHUB_REF_NAME `
            --repository "$env:GITHUB_WORKSPACE" `
            --output $gate --assets $assets @previous @manifests

      - name: Publish the module release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloads = Join-Path $env:RUNNER_TEMP 'artifacts'
          $gate = Join-Path $env:RUNNER_TEMP 'release-gate'
          $assets = Join-Path $env:RUNNER_TEMP 'release-assets'
          $tag = $env:GITHUB_REF_NAME
          $packages = @(
            Get-ChildItem -LiteralPath $assets -Filter '*.zip' |
              ForEach-Object { $_.FullName }
          )
          if ($packages.Count -ne 4) {
            throw "Expected four selected-module archives, found $($packages.Count)."
          }
          $evidence = @(
            Get-ChildItem -LiteralPath $downloads -Directory -Filter 'evidence-*' |
              ForEach-Object {
                $bundle = Join-Path $gate "$($_.Name).zip"
                Compress-Archive -Path (Join-Path $_.FullName '*') -DestinationPath $bundle
                $bundle
              }
          )
          if ($evidence.Count -ne 4) {
            throw "Expected four evidence bundles, found $($evidence.Count)."
          }
          $report = Get-Content -Raw -LiteralPath (Join-Path $gate 'release.json') | ConvertFrom-Json
          $title = $report.title
          # Only the byte-deterministic release assets are compared on an idempotent rerun; the
          # evidence bundles are re-compressed each run and are only required to be present.
          $deterministic = $packages + @(
            (Join-Path $gate 'packages.json'), (Join-Path $gate 'release.json'),
            (Join-Path $gate 'notes.md')
          )
          # Whether the exact tag is already published was resolved once, before the lineage
          # lookup; reuse that recorded result instead of probing a second time.
          $alreadyPublished = '${{ steps.previous.outputs.exists }}' -eq 'true'
          if ($alreadyPublished) {
            $published = Join-Path $env:RUNNER_TEMP 'published'
            New-Item -ItemType Directory -Force -Path $published | Out-Null
            gh release download $tag --dir $published
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to download the published assets of $tag."
            }
            foreach ($file in $deterministic) {
              $name = Split-Path -Leaf $file
              $publishedFile = Join-Path $published $name
              if (-not (Test-Path -LiteralPath $publishedFile -PathType Leaf)) {
                throw "The published release $tag is missing $name."
              }
              if ((Get-FileHash -LiteralPath $publishedFile -Algorithm SHA256).Hash -ne
                  (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash) {
                throw "The published asset $name does not match the verified bytes."
              }
            }
            foreach ($file in $evidence) {
              if (-not (Test-Path -LiteralPath (Join-Path $published (Split-Path -Leaf $file)) -PathType Leaf)) {
                throw "The published release $tag is missing $(Split-Path -Leaf $file)."
              }
            }
          }
          else {
            gh release create $tag --verify-tag --title $title `
              --notes-file (Join-Path $gate 'notes.md') @deterministic @evidence
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to publish the release $tag."
            }
          }
